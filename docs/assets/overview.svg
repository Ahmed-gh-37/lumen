<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title description">
  <title id="title">Lumen — a little clarity, right where you work.</title>
  <desc id="description">An interface illustration showing Lumen's dark floating assistant beside its compact notch teleprompter. Pale green accents highlight screen explanation, local notes, and presentation controls.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101a15"/>
      <stop offset="1" stop-color="#080d0b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#50734c" stop-opacity=".23"/>
      <stop offset="1" stop-color="#50734c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1b241e"/>
      <stop offset="1" stop-color="#101813"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-25%" width="170%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <g id="spark" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M0-13C2-3 3-2 13 0 3 2 2 3 0 13-2 3-3 2-13 0-3-2-2-3 0-13Z"/>
    </g>
    <g id="screen" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M-8-3V-8H-3M3-8H8V-3M8 3V8H3M-3 8H-8V3"/>
      <circle r="2"/>
    </g>
  </defs>
  <rect width="1440" height="880" rx="28" fill="url(#canvas)"/>
  <ellipse cx="1030" cy="440" rx="620" ry="580" fill="url(#glow)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(80 84)" color="#c7e89c">
      <use href="#spark"/>
      <text x="28" y="6" fill="#c7e89c" font-size="15" font-weight="600" letter-spacing="4">LUMEN</text>
    </g>
    <text x="76" y="224" fill="#f0f3e9" font-size="66" font-weight="500" letter-spacing="-3">
      <tspan x="76">A little clarity.</tspan>
      <tspan x="76" dy="78">Right where</tspan>
      <tspan x="76" dy="78">you work.</tspan>
    </text>
    <text x="80" y="466" fill="#a0b0a2" font-size="20">
      <tspan x="80">Your screen. Your next thought.</tspan>
      <tspan x="80" dy="32">Your words, at your pace.</tspan>
    </text>
    <path d="M80 550H500" stroke="#344337"/>
    <text x="80" y="587" fill="#c7e89c" font-size="12" letter-spacing="3">NATIVE MACOS</text>
    <text x="294" y="587" fill="#8e9e90" font-size="12" letter-spacing="3">MADE TO STAY CLOSE</text>

    <g transform="translate(80 648)">
      <rect width="450" height="150" rx="22" fill="#080d0b" stroke="#354437"/>
      <path d="M169 0H281V14Q281 24 271 24H179Q169 24 169 14Z" fill="#030604"/>
      <circle cx="26" cy="46" r="4" fill="#c7e89c"/>
      <text x="41" y="50" fill="#a0b0a2" font-size="11" letter-spacing="1.2">VOICE FOLLOW</text>
      <text x="25" y="93" fill="#ecf1e5" font-size="22">Stay with the words.</text>
      <text x="25" y="126" fill="#6f8173" font-size="20">Take a moment. Then continue.</text>
      <path d="M417 44V55M424 44V55" stroke="#c7e89c" stroke-width="2"/>
    </g>

    <g transform="translate(672 64)" filter="url(#shadow)">
      <rect width="688" height="752" rx="25" fill="url(#panel)" stroke="#405044" stroke-opacity=".8"/>
      <use href="#spark" x="43" y="44" color="#c7e89c"/>
      <text x="70" y="53" fill="#edf2e6" font-size="28" font-weight="600" letter-spacing="-1">lumen</text>
      <text x="177" y="50" fill="#9caf9c" font-size="9" letter-spacing="2">A LITTLE CLARITY</text>
      <g fill="none" stroke="#a4b49f" stroke-width="1.4" stroke-linecap="round">
        <path d="M566 35H586V49H566Z M573 35V39H579V35"/>
        <path d="M607 39H624M607 46H624M611 36V42M620 43V49"/>
        <path d="M648 43H660"/>
      </g>
      <g font-size="14">
        <text x="35" y="108" fill="#c7e89c" font-weight="600">Ask</text>
        <text x="100" y="108" fill="#95a38f">Listen</text>
        <text x="181" y="108" fill="#95a38f">Notes</text>
        <text x="260" y="108" fill="#95a38f">Prompter</text>
      </g>
      <text x="559" y="107" fill="#8c9c8b" font-size="10">⌥⌘Space to hide</text>
      <path d="M0 128H688" stroke="#354036"/>
      <path d="M35 128H63" stroke="#c7e89c" stroke-width="2"/>
      <g transform="translate(56 209)" stroke="#c7e89c" stroke-width="1.6" stroke-linecap="round">
        <path d="M0-18V18M-16-9L16 9M-16 9L16-9"/>
      </g>
      <text x="39" y="294" fill="#edf2e6" font-size="43" font-weight="500" letter-spacing="-1.5">
        <tspan x="39">A little clarity,</tspan>
        <tspan x="39" dy="51">right where you are.</tspan>
      </text>
      <text x="41" y="389" fill="#a0b09d" font-size="15">
        <tspan x="41">Ask a question. Bring in your screen.</tspan>
        <tspan x="41" dy="25">Keep the conversation in view.</tspan>
      </text>
      <use href="#screen" x="52" y="468" color="#c7e89c"/>
      <text x="78" y="473" fill="#d9e3d1" font-size="14">Explain what's on my screen</text>
      <path d="M636 463H645V472M645 463L635 473" fill="none" stroke="#a6b59d" stroke-width="1.4"/>
      <path d="M41 496H647" stroke="#344036"/>
      <g transform="translate(41 551)">
        <rect width="606" height="122" rx="17" fill="#dce9d1" fill-opacity=".035" stroke="#b9c9af" stroke-opacity=".18"/>
        <text x="20" y="36" fill="#a0ae98" font-size="16">Ask anything…</text>
        <use href="#screen" x="29" y="88" color="#a2b498"/>
        <text x="48" y="93" fill="#a0b498" font-size="12">Screen</text>
        <rect x="124" y="81" width="12" height="12" rx="2" fill="none" stroke="#7c8e75"/>
        <text x="143" y="92" fill="#8e9e86" font-size="11">Listen context</text>
        <circle cx="565" cy="84" r="19" fill="#c7e89c"/>
        <path d="M565 92V76M559 82L565 76 571 82" fill="none" stroke="#172211" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <path d="M0 704H688" stroke="#344036"/>
      <circle cx="31" cy="729" r="3" fill="#a5b494"/>
      <text x="44" y="733" fill="#9faf94" font-size="11">Your connection. Your context.</text>
      <circle cx="652" cy="729" r="8" fill="none" stroke="#84977b"/>
      <path d="M650 726V732M654 726V732" stroke="#84977b" stroke-width="1.2"/>
    </g>
  </g>
</svg>
